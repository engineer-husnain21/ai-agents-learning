<svg width="700" height="716" viewBox="0 0 700 716" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.box{fill:#f5f5f5;stroke:#999;stroke-width:1.5;rx:8;}
.gray{fill:#e8e8e8;}
.blue{fill:#dbe9ff;}
.amber{fill:#ffe9c2;}
.teal{fill:#c9f0e6;}
.coral{fill:#ffd6d0;}
.th{font:bold 14px sans-serif;fill:#222;}
.ts{font:12px sans-serif;fill:#555;}
.arr{stroke:#666;stroke-width:1.5;fill:none;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>

<rect class="box gray" x="130" y="40" width="220" height="56"/>
<text class="th" x="240" y="62" text-anchor="middle">New document uploaded</text>
<text class="ts" x="240" y="80" text-anchor="middle">status: pending</text>
<line x1="240" y1="96" x2="240" y2="156" class="arr" marker-end="url(#arrow)"/>

<rect class="box blue" x="130" y="156" width="220" height="56"/>
<text class="th" x="240" y="178" text-anchor="middle">Automated screening</text>
<text class="ts" x="240" y="196" text-anchor="middle">injection pattern scan</text>
<line x1="240" y1="212" x2="240" y2="272" class="arr" marker-end="url(#arrow)"/>

<rect class="box blue" x="130" y="272" width="220" height="56"/>
<text class="th" x="240" y="294" text-anchor="middle">Contradiction check</text>
<text class="ts" x="240" y="312" text-anchor="middle">keyword candidates + LLM judge</text>
<line x1="350" y1="290" x2="438" y2="290" class="arr" marker-end="url(#arrow)"/>
<line x1="240" y1="328" x2="240" y2="388" class="arr" marker-end="url(#arrow)"/>

<rect class="box coral" x="440" y="272" width="180" height="56"/>
<text class="th" x="530" y="294" text-anchor="middle">Conflict found</text>
<text class="ts" x="530" y="312" text-anchor="middle">quotes shown to reviewer</text>

<rect class="box amber" x="130" y="388" width="220" height="56"/>
<text class="th" x="240" y="410" text-anchor="middle">Human review</text>
<text class="ts" x="240" y="428" text-anchor="middle">approve or reject</text>
<line x1="350" y1="400" x2="438" y2="400" class="arr" marker-end="url(#arrow)"/>
<line x1="240" y1="444" x2="240" y2="504" class="arr" marker-end="url(#arrow)"/>

<rect class="box coral" x="440" y="388" width="180" height="56"/>
<text class="th" x="530" y="410" text-anchor="middle">Rejected</text>
<text class="ts" x="530" y="428" text-anchor="middle">reason recorded</text>

<rect class="box teal" x="130" y="504" width="220" height="56"/>
<text class="th" x="240" y="526" text-anchor="middle">Verified</text>
<text class="ts" x="240" y="544" text-anchor="middle">eligible for verified-only</text>
<line x1="240" y1="560" x2="240" y2="620" class="arr" marker-end="url(#arrow)"/>

<rect class="box coral" x="130" y="620" width="220" height="56"/>
<text class="th" x="240" y="642" text-anchor="middle">Content changed</text>
<text class="ts" x="240" y="660" text-anchor="middle">hash mismatch on read</text>

<path d="M350 648 L650 648 L650 420 L352 420" class="arr" marker-end="url(#arrow)" stroke-dasharray="3 3"/>
<text class="ts" x="590" y="530" text-anchor="middle">back to original approver</text>
</svg>