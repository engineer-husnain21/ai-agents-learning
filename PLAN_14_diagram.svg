<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.box{stroke-width:1.5;rx:8;}
.gray{fill:#e8e8e8;stroke:#999;}
.blue{fill:#dbe9ff;stroke:#5a8fd6;}
.amber{fill:#ffe9c2;stroke:#d6a34f;}
.teal{fill:#c9f0e6;stroke:#4fae94;}
.coral{fill:#ffd6d0;stroke:#d67a68;}
.th{font:bold 14px sans-serif;fill:#222;}
.ts{font:12px sans-serif;fill:#555;}
.arr{stroke:#666;stroke-width:1.5;fill:none;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>

<rect class="box gray" x="130" y="40" width="220" height="56"/>
<text class="th" x="240" y="62" text-anchor="middle">Upload</text>
<text class="ts" x="240" y="80" text-anchor="middle">graph run starts</text>
<line x1="240" y1="96" x2="240" y2="156" class="arr" marker-end="url(#arrow)"/>

<rect class="box blue" x="130" y="156" width="220" height="56"/>
<text class="th" x="240" y="178" text-anchor="middle">Screening</text>
<text class="ts" x="240" y="196" text-anchor="middle">injection scan</text>
<line x1="240" y1="212" x2="240" y2="272" class="arr" marker-end="url(#arrow)"/>

<rect class="box blue" x="130" y="272" width="220" height="56"/>
<text class="th" x="240" y="294" text-anchor="middle">Contradiction check</text>
<text class="ts" x="240" y="312" text-anchor="middle">embeddings + LLM judge</text>
<line x1="240" y1="328" x2="240" y2="388" class="arr" marker-end="url(#arrow)"/>

<rect class="box amber" x="130" y="388" width="220" height="56"/>
<text class="th" x="240" y="410" text-anchor="middle">Interrupt</text>
<text class="ts" x="240" y="428" text-anchor="middle">waits, persisted to disk</text>

<text class="ts" x="245" y="474" text-anchor="middle">approve</text>
<line x1="240" y1="444" x2="240" y2="504" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="440" y="452" text-anchor="middle">reject</text>
<path d="M350 400 L480 400 L480 502" class="arr" marker-end="url(#arrow)"/>

<rect class="box teal" x="130" y="504" width="220" height="56"/>
<text class="th" x="240" y="536" text-anchor="middle">Verified</text>

<rect class="box coral" x="370" y="504" width="220" height="56"/>
<text class="th" x="480" y="536" text-anchor="middle">Rejected</text>
</svg>